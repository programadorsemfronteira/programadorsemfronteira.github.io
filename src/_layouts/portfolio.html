<!doctype html>
<html lang="{{ page.lang }}">
  {% include head.html %}
  <body class="portfolio-page">
    <a class="portfolio-skip-link" href="#main">{{ page.copy.skip }}</a>
    {% include portfolio/header.html %}
    <main id="main">{{ content }}</main>
    {% include portfolio/footer.html %}
    <script src="{{ '/assets/js/portfolio-motion.js' | relative_url }}?v=portfolio-scroll-reveal-2"></script>
    <script src="{{ '/assets/js/portfolio-navigation.js' | relative_url }}?v=portfolio-arrow-themify-1"></script>
    {% if page.enable_timeline_navigation %}<script src="{{ '/assets/js/portfolio-timeline.js' | relative_url }}"></script><script src="{{ '/assets/js/portfolio-journey-artifacts.js' | relative_url }}?v=journey-mobile-layout-11"></script>{% endif %}
    <script src="{{ '/assets/js/portfolio-journey-hero.js' | relative_url }}?v=hero-image-hover-5"></script>
    {% if page.enable_tag_filter %}<script src="{{ '/assets/js/portfolio-tags.js' | relative_url }}"></script>{% endif %}
  </body>
</html>
