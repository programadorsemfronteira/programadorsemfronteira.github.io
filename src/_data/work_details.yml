      approach:
        - "Entreguei e modernizei sistemas web, comércio eletrônico, cobrança, pagamentos e distribuição de arquivos grandes com PHP, .NET, AngularJS e Yii."
        - "Criei o CMS que deu aos editores acesso ao conteúdo do site, trabalhei próximo ao marketing para lançar campanhas e entreguei um dos primeiros sistemas de veiculação de banners para os sites de jogos."
        - "Fui responsável pela arquitetura web, incluindo SEO, acessibilidade, desenvolvimento responsivo e mobile-first e medição de desempenho com Google Analytics, Tag Manager, PageSpeed Insights e Core Web Vitals."
