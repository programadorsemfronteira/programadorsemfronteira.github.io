    - "Owned web architecture across SEO, accessibility, responsive and mobile-first development, and performance measurement with Google Analytics, Tag Manager, PageSpeed Insights, and Core Web Vitals."
    - "When I arrived, the web farm ran only Apache. I put Tux in front of it, then later moved to Varnish with Nginx to serve heavy traffic more efficiently; I also tuned the backend and added monitoring and incident-response integrations."
    - "Introduced Jenkins CI and blue-green deployment practices; mentored engineers through reviews, training, SOLID principles, and testing."
  impact: "Made self-managed servers more efficient under thousands of simultaneous requests while sustaining editorial publishing, campaign delivery, reliable releases, and the growth of a six-person team."
  lesson: "Leadership is holding the product, the operating system, and the growth of the team in view at the same time."
  metrics:
    - { value: "6", label: "ENGINEERS LED" }
    - { value: "1000s", label: "SIMULTANEOUS REQUESTS" }
    - { value: "CI", label: "REPEATABLE RELEASES" }
