  period: { en: "FEB 2008-FEB 2016", pt-br: "FEV 2008-FEV 2016", es: "FEB 2008-FEB 2016" }
  role: "Lead Developer"
  challenge: "At what was then Brazil's largest online-game publisher, keep a site on self-managed dedicated servers responsive under thousands of simultaneous requests while leading a six-person engineering team."
  approach:
    - "Delivered and modernized web, e-commerce, billing, payment, and large-file delivery systems using PHP, .NET, AngularJS, and Yii."
