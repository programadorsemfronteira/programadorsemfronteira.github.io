G2i:
  heading: { en: "Building AI<br>training environments", pt-br: "Ambientes para<br>treinar IA", es: "Entornos para<br>entrenar IA" }
  period: { en: "JAN 2026-PRESENT", pt-br: "JAN 2026-HOJE", es: "ENE 2026-HOY" }
  role: "Senior Software Engineer / AI Engineer"
  challenge: "Deliver dependable training environments for a frontier AI lab while working across unfamiliar codebases and customer-facing workstreams."
  approach:
    - "Turn issue reports into complete changes across frontend, backend, APIs, and databases, then carry them through review and delivery."
    - "Use repeatable benchmarks, indexing, query improvements, and regression tests to solve application and database bottlenecks."
    - "Delegate code creation to AI agents in focused workstreams, then personally review and validate the result for security, accuracy, quality, and release readiness."
  impact: "Personally owned the final quality gate for incidents, fixes, features, and customer delivery using code review, exploratory checks, automated tests, end-to-end validation, and CI."
  lesson: "AI-assisted implementation accelerates delivery when the engineer remains accountable for the context, verification, and final result."
  metrics:
    - { value: "E2E", label: "FULL-STACK OWNERSHIP" }
    - { value: "CI", label: "VERIFICATION PATH" }
    - { value: "RL", label: "TRAINING ENVIRONMENTS" }
  translations:
    pt-br:
      labels: { challenge: "DESAFIO", role: "FUNÇÃO", approach: "ABORDAGEM", impact: "IMPACTO", lesson: "LIÇÃO" }
      role: "Engenheiro de Software Sênior / Engenheiro de IA"
      challenge: "Entregar ambientes de treinamento confiáveis para um laboratório de IA de fronteira, trabalhando em bases de código desconhecidas e em frentes voltadas ao cliente."
      approach:
        - "Transformar relatos de problemas em mudanças completas no frontend, backend, APIs e bancos de dados, conduzindo-as pela revisão até a entrega."
        - "Usar benchmarks reproduzíveis, indexação, melhorias em consultas e testes de regressão para resolver gargalos de desempenho da aplicação e do banco de dados."
        - "Delegar a criação de código a agentes de IA em frentes bem definidas e revisar e validar pessoalmente o resultado quanto à segurança, precisão, qualidade e prontidão para lançamento."
      impact: "Fui responsável pela verificação final da qualidade de incidentes, correções, funcionalidades e entregas ao cliente, usando revisão de código, testes exploratórios, testes automatizados, validação ponta a ponta e CI."
      lesson: "A implementação assistida por IA acelera a entrega quando o engenheiro continua responsável pelo contexto, pela verificação e pelo resultado final."
      metrics:
        - { value: "E2E", label: "RESPONSABILIDADE FULL-STACK" }
        - { value: "CI", label: "FLUXO DE VERIFICAÇÃO" }
        - { value: "RL", label: "AMBIENTES DE TREINAMENTO" }
    es:
      labels: { challenge: "DESAFÍO", role: "FUNCIÓN", approach: "ENFOQUE", impact: "IMPACTO", lesson: "LECCIÓN" }
      role: "Ingeniero de Software Sénior / Ingeniero de IA"
      challenge: "Entregar entornos de entrenamiento confiables para un laboratorio de IA de frontera, trabajando con bases de código desconocidas y en proyectos orientados al cliente."
      approach:
        - "Convertir informes de problemas en cambios completos en frontend, backend, API y bases de datos, y llevarlos desde la revisión hasta la entrega."
        - "Usar pruebas de rendimiento repetibles, índices, mejoras de consultas y pruebas de regresión para resolver cuellos de botella de la aplicación y la base de datos."
        - "Delegar la creación de código a agentes de IA en tareas bien definidas y revisar y validar personalmente el resultado en seguridad, precisión, calidad y preparación para el lanzamiento."
      impact: "Fui responsable de la verificación final de calidad de incidentes, correcciones, funcionalidades y entregas al cliente, mediante revisión de código, pruebas exploratorias y automatizadas, validación de extremo a extremo e integración continua."
      lesson: "La implementación asistida por IA acelera la entrega cuando el ingeniero sigue siendo responsable del contexto, la verificación y el resultado final."
      metrics:
        - { value: "E2E", label: "RESPONSABILIDAD FULL-STACK" }
        - { value: "CI", label: "FLUJO DE VERIFICACIÓN" }
        - { value: "RL", label: "ENTORNOS DE ENTRENAMIENTO" }

Aiah:
  heading: { en: "Engineering with AI<br>LLM customer care", pt-br: "Engenharia com IA<br>Suporte com LLM", es: "Ingeniería con IA<br>Soporte con LLM" }
  period: { en: "2023-2026", pt-br: "2023-2026", es: "2023-2026" }
  role: "Senior Full-Stack Developer / AI Engineer"
  challenge: "Integrate Meta's WhatsApp API into customer service while preventing invented products, services, and contact numbers. The system also needed high availability and failure recovery across AWS, WhatsApp, and LLM provider outages."
  approach:
    - "Integrated Meta's WhatsApp API with the customer-service workflow, connecting messages to LLM responses, tool calls, and human handoff."
    - "Built validation and response guardrails to keep product, service, and contact information tied to real business data instead of fabricated model output."
    - "Used GraphQL, asynchronous message processing, RAG with pgvector, and AWS infrastructure to support the product and its recovery paths."
    - "Implemented server-side rendering for public content so the product could be discovered by search engines without giving up the interactive application experience."
    - "Owned application architecture and production delivery, designing recovery behavior for AWS and external API interruptions so conversations could resume safely."
  impact: "Delivered WhatsApp-connected AI customer service with guarded replies, validated workflows, and human handoff. During an AWS outage, no messages were lost; after AWS recovered, the system resumed and answered every message."
  lesson: "Customer-facing AI needs both factual guardrails and failure recovery: a fluent reply is not enough if the information is invented or a message is lost."
  metrics:
    - { value: "LLM", label: "TOOL-DRIVEN WORKFLOWS" }
    - { value: "RAG", label: "RETRIEVAL LAYER" }
    - { value: "0", label: "MESSAGES LOST IN AWS OUTAGE" }
  translations:
    pt-br:
      labels: { challenge: "DESAFIO", role: "FUNÇÃO", approach: "ABORDAGEM", impact: "IMPACTO", lesson: "LIÇÃO" }
      role: "Desenvolvedor Full-Stack Sênior / Engenheiro de IA"
      challenge: "Integrar a API do WhatsApp da Meta ao atendimento sem inventar produtos, serviços ou números de contato. O sistema também precisava de alta disponibilidade e recuperação de falhas na AWS, no WhatsApp e nos provedores de LLM."
      approach:
        - "Integrei a API do WhatsApp da Meta ao fluxo de atendimento, conectando mensagens a respostas do LLM, chamadas de ferramentas e transferência para atendimento humano."
        - "Criei validações e proteções para manter informações sobre produtos, serviços e contatos vinculadas aos dados reais do negócio, evitando conteúdo inventado pelo modelo."
        - "Usei GraphQL, processamento assíncrono de mensagens, RAG com pgvector e infraestrutura AWS para sustentar o produto e seus fluxos de recuperação."
        - "Implementei renderização no servidor para o conteúdo público ser encontrado em buscadores, sem abrir mão da experiência interativa da aplicação."
        - "Assumi a arquitetura da aplicação e a entrega em produção, projetando a recuperação de interrupções da AWS e de APIs externas para que as conversas pudessem continuar com segurança."
      impact: "Entreguei atendimento com IA integrado ao WhatsApp, com respostas protegidas, fluxos validados e transferência para uma pessoa. Durante uma indisponibilidade da AWS, nenhuma mensagem foi perdida; após a recuperação, o sistema voltou a responder a todas elas."
      lesson: "Uma IA voltada ao cliente precisa de proteções contra informações inventadas e de recuperação de falhas: uma resposta fluente não basta se uma mensagem se perde."
      metrics:
        - { value: "LLM", label: "FLUXOS ORIENTADOS POR FERRAMENTAS" }
        - { value: "RAG", label: "CAMADA DE RECUPERAÇÃO" }
        - { value: "0", label: "MENSAGENS PERDIDAS NA FALHA DA AWS" }
    es:
      labels: { challenge: "DESAFÍO", role: "FUNCIÓN", approach: "ENFOQUE", impact: "IMPACTO", lesson: "LECCIÓN" }
      role: "Desarrollador Full-Stack Sénior / Ingeniero de IA"
      challenge: "Integrar la API de WhatsApp de Meta en la atención al cliente sin inventar productos, servicios ni números de contacto. El sistema también necesitaba alta disponibilidad y recuperación ante fallos de AWS, WhatsApp y los proveedores de LLM."
      approach:
        - "Integré la API de WhatsApp de Meta en el flujo de atención, conectando mensajes con respuestas del LLM, llamadas a herramientas y transferencia a una persona."
        - "Creé validaciones y salvaguardas para mantener la información sobre productos, servicios y contactos vinculada a datos reales del negocio, evitando contenido inventado por el modelo."
        - "Usé GraphQL, procesamiento asíncrono de mensajes, RAG con pgvector e infraestructura de AWS para sostener el producto y sus rutas de recuperación."
        - "Implementé renderizado en el servidor para que los buscadores encontraran el contenido público, sin renunciar a la experiencia interactiva de la aplicación."
        - "Asumí la arquitectura de la aplicación y la entrega en producción, diseñando la recuperación ante interrupciones de AWS y de API externas para que las conversaciones pudieran continuar de forma segura."
      impact: "Entregué atención con IA integrada con WhatsApp, con respuestas protegidas, flujos validados y transferencia a una persona. Durante una caída de AWS no se perdió ningún mensaje; tras la recuperación, el sistema volvió a responderlos todos."
      lesson: "Una IA orientada al cliente necesita protección frente a datos inventados y recuperación ante fallos: una respuesta fluida no basta si se pierde un mensaje."
      metrics:
        - { value: "LLM", label: "FLUJOS ORIENTADOS POR HERRAMIENTAS" }
        - { value: "RAG", label: "CAPA DE RECUPERACIÓN" }
        - { value: "0", label: "MENSAJES PERDIDOS EN LA CAÍDA DE AWS" }

Wolf Pro Link:
