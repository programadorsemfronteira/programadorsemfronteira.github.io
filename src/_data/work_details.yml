Freedom:
  heading: { en: "Evidence-first<br>paper trading", pt-br: "Trading simulado<br>com evidências", es: "Trading simulado<br>con evidencia" }
  period: { en: "2020-PRESENT", pt-br: "2020-HOJE", es: "2020-HOY" }
  role: "Senior Full-Stack Developer"
  challenge: "Turn B3 market data and trading research into reproducible paper decisions without look-ahead leakage, invented fills, or unsupported performance claims."
  approach:
    - "Built canonical market-data ingestion and immutable snapshots with point-in-time identity, correction history, and reproducible feature inputs."
    - "Implemented a deterministic B3 momentum strategy with completed-D1 setup confirmation and backtests that separate signal quality from trade outcomes."
    - "Connected approved decisions to paper-only risk controls, a persistent simulated broker, reconciliation, and idempotent replay after interruptions."
    - "Kept experimental ML behind qualification gates; the current unqualified models and sealed holdout cannot drive the paper strategy."
  impact: "Delivered an operator-runnable paper-trading path whose decisions, simulated fills, and outcomes can be traced and replayed, without claiming proven profitability or real-money execution."
  lesson: "In financial systems, reproducibility, failure recovery, and an honest 'not qualified' result are product features, not obstacles to shipping."
  metrics:
    - { value: "PAPER", label: "SIMULATED EXECUTION" }
    - { value: "REPLAY", label: "DURABLE DECISIONS" }
    - { value: "SEALED", label: "ML RESEARCH BOUNDARY" }
  translations:
    pt-br:
      labels: { challenge: "DESAFIO", role: "FUNÇÃO", approach: "ABORDAGEM", impact: "IMPACTO", lesson: "LIÇÃO" }
      role: "Desenvolvedor Full-Stack Sênior"
      challenge: "Transformar dados do mercado B3 e pesquisa de estratégias em decisões simuladas reproduzíveis, sem vazamento de informação futura, execuções inventadas ou promessas de desempenho sem evidência."
      approach:
        - "Construí a ingestão canônica de dados de mercado e snapshots imutáveis com identidade temporal, histórico de correções e entradas reproduzíveis para indicadores."
        - "Implementei uma estratégia determinística de momentum para a B3, com confirmação por setups após o fechamento diário e backtests que separam a qualidade do sinal do resultado das operações."
        - "Conectei decisões aprovadas a controles de risco exclusivos para simulação, corretora simulada persistente, reconciliação e reprocessamento idempotente após interrupções."
        - "Mantive o ML experimental atrás de critérios de qualificação; os modelos ainda não qualificados e o conjunto de teste protegido não podem orientar a estratégia simulada."
      impact: "Entreguei um fluxo executável de trading simulado, com decisões, execuções simuladas e resultados rastreáveis e reproduzíveis, sem alegar lucratividade comprovada ou operação com dinheiro real."
      lesson: "Em sistemas financeiros, reprodutibilidade, recuperação de falhas e um resultado honesto de 'não qualificado' são funcionalidades do produto, não obstáculos à entrega."
      metrics:
        - { value: "PAPER", label: "EXECUÇÃO SIMULADA" }
        - { value: "REPLAY", label: "DECISÕES PERSISTIDAS" }
        - { value: "SELADO", label: "LIMITE DA PESQUISA EM ML" }
    es:
      labels: { challenge: "DESAFÍO", role: "FUNCIÓN", approach: "ENFOQUE", impact: "IMPACTO", lesson: "LECCIÓN" }
      role: "Desarrollador Full-Stack Sénior"
      challenge: "Convertir datos del mercado B3 e investigación de estrategias en decisiones simuladas reproducibles, sin filtración de información futura, ejecuciones inventadas ni promesas de rendimiento sin evidencia."
      approach:
        - "Construí la ingesta canónica de datos de mercado y snapshots inmutables con identidad temporal, historial de correcciones y entradas reproducibles para indicadores."
        - "Implementé una estrategia determinista de momentum para B3, con confirmación por setups tras el cierre diario y backtests que separan la calidad de la señal del resultado de las operaciones."
        - "Conecté decisiones aprobadas con controles de riesgo exclusivos para simulación, bróker simulado persistente, conciliación y reprocesamiento idempotente tras interrupciones."
        - "Mantuve el ML experimental detrás de criterios de calificación; los modelos aún no calificados y el conjunto de prueba protegido no pueden dirigir la estrategia simulada."
      impact: "Entregué un flujo operable de trading simulado, con decisiones, ejecuciones simuladas y resultados trazables y reproducibles, sin afirmar rentabilidad demostrada ni operar con dinero real."
      lesson: "En sistemas financieros, la reproducibilidad, la recuperación ante fallos y un resultado honesto de 'no calificado' son funciones del producto, no obstáculos para entregarlo."
      metrics:
        - { value: "PAPER", label: "EJECUCIÓN SIMULADA" }
        - { value: "REPLAY", label: "DECISIONES PERSISTIDAS" }
        - { value: "SELLADO", label: "LÍMITE DE INVESTIGACIÓN ML" }

Redestina:
  heading: { en: "Container transfer<br>coordination", pt-br: "Redirecionamento<br>de contêineres", es: "Redirección de<br>contenedores" }
  period: { en: "2023-2026", pt-br: "2023-2026", es: "2023-2026" }
  role: "Senior Full-Stack Developer"
  challenge: "Coordinate container transfers between port terminals when arrivals, documentation, and stakeholder notifications must follow a reliable sequence with secure certificate-based access."
  approach:
    - "Monitored container arrivals in an external system and initiated the transfer workflow when action was needed."
    - "Coordinated checks, documentation, and notifications in the required order while safeguarding certificate-based access."
    - "Used DynamoDB Streams and SQS to drive downstream work and reprocess failed tasks."
    - "Implemented server-side rendering for public pages, improving their search visibility while keeping the operational application interactive."
    - "Supported delivery through code review, engineering guidance, and junior-developer mentoring."
  impact: "Improved container handoff reliability through ordered steps and retryable tasks, while strengthening team delivery through code reviews and mentoring junior developers."
  lesson: "In logistics, reliability is a workflow property: secure access, ordered steps, and failure recovery matter as much as the happy path."
  metrics:
    - { value: "AUTO", label: "ARRIVAL MONITORING" }
    - { value: "ORDER", label: "COORDINATED HANDOFFS" }
    - { value: "RETRY", label: "FAILED TASK RECOVERY" }
  translations:
    pt-br:
      labels: { challenge: "DESAFIO", role: "FUNÇÃO", approach: "ABORDAGEM", impact: "IMPACTO", lesson: "LIÇÃO" }
      role: "Desenvolvedor Full-Stack Sênior"
      challenge: "Coordenar transferências de contêineres entre terminais portuários, garantindo que chegadas, documentação e notificações sigam a ordem correta com acesso seguro por certificado."
      approach:
        - "Monitorei a chegada de contêineres em um sistema externo e iniciei o fluxo de transferência quando era preciso agir."
        - "Coordenei verificações, documentação e notificações na ordem necessária, protegendo o acesso por certificado."
        - "Usei DynamoDB Streams e SQS para acionar as próximas etapas e reprocessar tarefas com falha."
        - "Implementei renderização no servidor para páginas públicas, melhorando sua encontrabilidade em buscadores e mantendo a aplicação operacional interativa."
        - "Apoiei a entrega com revisão de código, orientação técnica e mentoria de desenvolvedores iniciantes."
      impact: "Tornei as transferências mais confiáveis com etapas ordenadas e reprocessamento de falhas, enquanto fortalecia a entrega do time com revisões de código e mentoria de desenvolvedores juniores."
      lesson: "Em logística, confiabilidade depende do fluxo inteiro: acesso seguro, etapas na ordem certa e recuperação de falhas são tão importantes quanto o caminho ideal."
      metrics:
        - { value: "AUTO", label: "MONITORAMENTO DE CHEGADAS" }
        - { value: "ORDEM", label: "ETAPAS COORDENADAS" }
        - { value: "FILAS", label: "REPROCESSAMENTO DE FALHAS" }
    es:
      labels: { challenge: "DESAFÍO", role: "FUNCIÓN", approach: "ENFOQUE", impact: "IMPACTO", lesson: "LECCIÓN" }
      role: "Desarrollador Full-Stack Sénior"
      challenge: "Coordinar traslados de contenedores entre terminales portuarias, asegurando que llegadas, documentación y avisos sigan la secuencia correcta con acceso seguro mediante certificado."
      approach:
        - "Supervisé la llegada de contenedores en un sistema externo e inicié el flujo de traslado cuando era necesario actuar."
        - "Coordiné verificaciones, documentación y avisos en el orden requerido, protegiendo el acceso mediante certificado."
        - "Usé DynamoDB Streams y SQS para activar los pasos siguientes y reprocesar tareas fallidas."
        - "Implementé renderizado en el servidor para páginas públicas, mejorando su visibilidad en buscadores y manteniendo interactiva la aplicación operativa."
        - "Apoyé la entrega con revisión de código, orientación técnica y mentoría a desarrolladores principiantes."
      impact: "Hice más fiables los traslados con pasos ordenados y reprocesamiento de fallos, mientras fortalecía las entregas del equipo mediante revisiones de código y mentoría a desarrolladores júnior."
      lesson: "En logística, la fiabilidad depende de todo el flujo: acceso seguro, pasos ordenados y recuperación ante fallos importan tanto como el camino ideal."
      metrics:
        - { value: "AUTO", label: "MONITOREO DE LLEGADAS" }
        - { value: "ORDEN", label: "PASOS COORDINADOS" }
        - { value: "COLAS", label: "REPROCESAMIENTO DE FALLOS" }

Rocketicons:
  heading: { en: "Building an icon<br>toolkit", pt-br: "Criando um kit<br>de ícones", es: "Creando un kit<br>de iconos" }
  period: { en: "2025-PRESENT", pt-br: "2025-HOJE", es: "2025-HOY" }
  role: "Co-creator & Maintainer"
  challenge: "Make large icon collections practical for web and native apps without forcing entire libraries into application bundles, while keeping the public catalog affordable to operate."
  approach:
    - "Together, we built a CLI that initializes TypeScript projects and writes selected icon components into local source for review and version control."
    - "We developed shared rendering utilities and Tailwind-compatible styling for React and React Native."
    - "Built on an SSR foundation to generate the localized explorer and versioned catalog as a static site on Cloudflare Pages after Vercel and AWS Amplify became too expensive."
    - "Designed SEO for search engines and AI agents so the public catalog can be discovered and understood."
  impact: "Developers can keep only the icons they choose in their own codebase, with a consistent component API across web and native projects; the public catalog is generated from an SSR foundation and delivered statically on Cloudflare Pages."
  lesson: "For open source, architecture includes hosting economics: simplifying delivery can keep a useful project sustainable."
  metrics:
    - { value: "LOCAL", label: "SELECTED ICON SOURCE" }
    - { value: "WEB/RN", label: "SHARED COMPONENT API" }
    - { value: "STATIC", label: "CLOUDFLARE PAGES" }
  translations:
    pt-br:
      labels: { challenge: "DESAFIO", role: "FUNÇÃO", approach: "ABORDAGEM", impact: "IMPACTO", lesson: "LIÇÃO" }
      role: "Cocriador e mantenedor"
      challenge: "Tornar grandes coleções de ícones práticas para aplicações web e nativas, sem levar bibliotecas inteiras para o bundle, e manter o catálogo público viável financeiramente."
      approach:
        - "Juntos, criamos uma CLI que configura projetos TypeScript e grava os componentes de ícones escolhidos no código local, onde podem ser revisados e versionados."
        - "Desenvolvemos utilitários de renderização e estilos compatíveis com Tailwind para React e React Native."
