en:
  eyebrow_number: "02"
  eyebrow_period: "1990s → NOW · BUILT, NOT GIVEN"
  title: "I DIDN'T INHERIT\nA PATH INTO"
  emphasis: "technology. I built one."
  description: "I was born in a favela in a small Brazilian town, without an obvious path into technology. What I had was curiosity, teachers who recognized it, and the conviction that learning could change the direction of my life."
  navigation_label: "Journey chapter navigation"
  timeline_label: "Life and career timeline"
  image_alt: "A winding mountain road at dawn, moving through mist toward the horizon."
  image_legend: "ONE ROAD · NO SHORTCUTS"
  established: "DRIVEN BY CURIOSITY"
  chapter_label: "CH."
  problem_label: "THE CHALLENGE:"
  learned_label: "WHAT I LEARNED"
  mindset_label: "MINDSET FORGED"
  technology_label: "TECH"
  transition: "The next chapter called for a wider system."
  work_link: "SEE THE WORK"
  close:
    eyebrow: "THE NEXT CHAPTER"
    title: "The technology keeps changing."
    emphasis: "What it made possible changed everything."
    description: "I began this journey believing technology could transform my life. It did. The kid from a favela in a small town became an engineer whose work crossed borders. I traveled through Brazil and the world, built a home and a family, became the father of an amazing child, and gained the ability to support my parents and the people I love. Those achievements are not separate from my professional journey. They are the reason it matters."
  chapters:
    - period: "1990s-EARLY 2000s"
      nav_year: "1990s"
      eyebrow: "ACCESS · CURIOSITY · SELF-DIRECTION"
      title: "The first system I had to build was my own future."
      role: "STUDENT / TEACHER / SELF-DIRECTED TECHNOLOGIST"
      problem: "Access to technology was scarce, and there was no established path waiting for me."
      story:
        - "Teachers noticed my dedication and helped me enter public computer programs. One opportunity led to another, until I found myself learning BASIC and QBasic without yet realizing that I had started learning how to program."
        - "My first computer outside an institution was an old XT that an uncle brought home. I played Carmen Sandiego, of course, but I also wanted to understand what happened before the game appeared: how the machine started, where its limits came from, and what made the system work."
        - "Later, I studied data processing, learned Clipper, and started building a system for a neighborhood community center. I took apart and rebuilt my first computer, installed Linux, recompiled its kernel to make a soft modem work, and built a home network. Before being paid to work in technology, I was already learning, building, troubleshooting, and teaching it."
      learned: "You do not need perfect conditions to begin. You need curiosity, persistence, and the courage to work beyond what you already know."
      mindset: "My starting point does not determine how far I can go."
      tech: ["BASIC", "QBasic", "Clipper", "Linux", "Hardware", "Networking"]
      tags: "backend,infrastructure"
    - period: "EARLY CAREER"
      nav_year: "START"
      eyebrow: "INFRASTRUCTURE · OPERATIONS · FIRST BREAK"
      title: "I earned the opportunity before I was ready for it."
      role: "INFRASTRUCTURE AND TECHNICAL SUPPORT · CONSOFT"
      problem: "My first technology role required Windows networking and Windows NT. I knew neither."
      story:
        - "I convinced one friend to bring a computer to my house, borrowed a switch from another, and built a Windows network so I could experiment before the interview. I got the job. Then I spent my first day building a Windows NT practice environment and teaching myself how to do the work."
        - "Supporting infrastructure for the São Paulo State Department of Finance gave me a view many developers encounter much later. I worked with networks, routing, DNS, web and mail servers, databases, operating systems, and production support. I also built a PHP and MySQL process-tracking tool. Infrastructure gave me the foundation. Software showed me how much more I could create with it."
      learned: "Applications do not live in isolation. Behind every line of code is an operating system, a network, a database, a security boundary, and someone depending on all of it to work."
      mindset: "Learn the whole system, especially the parts other people overlook."
      tech: ["TCP/IP", "DNS", "Linux", "Windows Server", "Active Directory", "Solaris", "PHP", "MySQL"]
      tags: "infrastructure,backend"
    - period: "2008-2016"
      nav_year: "2008"
      eyebrow: "DEVELOPMENT · SCALE · LEADERSHIP"
      title: "I joined as a developer. I grew into an owner."
      role: "PHP DEVELOPER → .NET DEVELOPER → LEAD DEVELOPER · LEVEL UP GAMES"
      problem: "One of Brazil's largest online-game publishers needed to serve players, payments, support, e-commerce, and large downloads under intense demand."
      story:
        - "My infrastructure background changed the way I approached software. When servers struggled under traffic, I could follow the problem across the network, web server, cache, database, and deployment environment. I began mentoring a junior developer, moved to the .NET team closer to the core business, and eventually led a six-person team while managing projects and delivery."
        - "Soon after joining, I identified security weaknesses and proposed mitigations. I was technically right, but I had not yet learned how to turn knowledge into organizational action. When the company was later attacked, I joined the incident response effort. Discovering a risk is only the beginning. A leader must communicate it in a way that makes action possible."
      learned: "Engineering leadership is helping people understand the problem, make better decisions, and move together when the stakes are real."
      mindset: "Own the outcome, not only the implementation."
      tech: ["PHP", ".NET", "C#", "AngularJS", "Yii", "Apache", "Nginx", "Varnish", "Jenkins"]
      tags: "fullstack,backend,leadership,quality"
    - period: "2016-2019"
      nav_year: "2016"
      eyebrow: "GLOBAL DELIVERY · DEVOPS · ARCHITECTURE"
      title: "My work crossed borders before I did."
      role: "FRONTEND DEVELOPER / DEVOPS ENGINEER / SOFTWARE ARCHITECT · CROSSOVER"
      problem: "Global teams needed to modernize long-lived enterprise systems without disrupting the people already depending on them."
      story:
        - "Crossover was my first experience working for a US company. I worked across frontend development, DevOps, cloud infrastructure, and software architecture, deepening my experience with Docker, Azure, AWS, CI/CD, and enterprise modernization."
        - "The role changed how I thought about architecture. A good idea was not enough. I had to make the reasoning visible, test assumptions, build proofs of concept, and give distributed teams evidence they could use to move forward."
      learned: "Architecture is not authority. It is the practice of turning ambiguity into decisions a team can understand, test, and execute."
      mindset: "Make the direction clear enough for others to build on it."
      tech: ["AngularJS", "Docker", "CI/CD", "Azure", "AWS", "SQL Server", "IBM Watson"]
      tags: "frontend,backend,fullstack,leadership,quality"
    - period: "2019-2023"
      nav_year: "2019"
      eyebrow: "PLATFORM MODERNIZATION · ACCESSIBILITY"
      title: "I learned to modernize without losing what already worked."
      role: "SENIOR FULL-STACK DEVELOPER / SENIOR SOFTWARE ENGINEER · CEROS"
      problem: "A mature creative platform needed to evolve across its APIs, frontend, accessibility, testing, infrastructure, and engineering practices."
      story:
        - "At Ceros, modernization was not a single migration. I designed APIs, helped move the frontend from Backbone to React, fixed accessibility issues, strengthened automated testing, and improved the infrastructure and delivery systems around the product."
        - "The work demanded more than replacing old technology. Every architectural decision affected customers, product teams, and the engineers who would maintain the platform after us."
      learned: "The best modernization respects the value already inside a product while removing the constraints that prevent it from moving forward."
      mindset: "Leave the platform more capable than you found it."
      tech: ["React", "TypeScript", "NestJS", "Docker", "Jenkins", "Terraform", "Cloudflare", "E2E Testing"]
      tags: "frontend,backend,fullstack,accessibility,leadership,quality"
    - period: "2023-2026"
      nav_year: "2023"
      eyebrow: "ZERO TO ONE · PRODUCT OWNERSHIP · AI"
      title: "The specification was often an idea and a conversation."
      role: "SENIOR FULL-STACK DEVELOPER / AI ENGINEER · EARLY-STAGE PRODUCTS"
      problem: "Early-stage companies needed to turn uncertain ideas into products that people could use and the business could operate."
      story:
        - "For almost three years, I helped small companies take ideas from paper to MVP and from MVP to production. There was rarely a large team or a perfect specification, so I moved between product discovery, interface decisions, APIs, data, cloud infrastructure, delivery, and mentoring."
        - "This was also where AI became central to my work, both as a product capability and an engineering partner. I learned that connecting an application to a model is the easy part. The real product lives in everything around it: context, validation, state, human handoff, security, recovery, cost, and trust."
      learned: "Early-stage engineering is the discipline of turning uncertainty into something useful, testable, and real."
      mindset: "Do not wait for certainty. Build the system that creates it."
      tech: ["TypeScript", "React", "Node.js", "GraphQL", "AWS", "ECS", "CDK", "RAG", "LLM Workflows"]
      tags: "ai,frontend,backend,fullstack,leadership,quality"
    - period: "2026-NOW"
      nav_year: "2026"
      eyebrow: "AI-NATIVE DELIVERY · ENGINEERING JUDGMENT"
      title: "Software development changed. I changed with it."
      role: "SENIOR SOFTWARE ENGINEER / AI ENGINEER · G2i"
      problem: "Fast-moving projects required complete features across unfamiliar codebases, frequent context changes, and an uncompromising delivery pace."
      story:
        - "At G2i, AI agents became part of my complete engineering workflow. I direct them across full-stack workstreams by providing the context, architecture, constraints, and acceptance criteria needed to produce useful results."
        - "Agents provide leverage, not accountability. I remain responsible for reviewing the work, challenging assumptions, testing behavior, checking security and performance, and deciding whether it is ready to ship. I was not watching the next era of software development arrive. I was already working inside it."
      learned: "AI can multiply implementation capacity. It cannot replace context, taste, responsibility, or engineering judgment."
      mindset: "Use AI as leverage. Keep responsibility human."
      tech: ["AI Agents", "TypeScript", "APIs", "Databases", "Playwright", "Vitest", "CI/CD", "Performance Engineering"]
      tags: "ai,frontend,backend,fullstack,quality"

pt-br:
  eyebrow_number: "02"
  eyebrow_period: "ANOS 1990 → HOJE · CONSTRUÍDO, NÃO HERDADO"
  title: "NÃO HERDEI\nUM CAMINHO PARA A"
  emphasis: "tecnologia. Eu construí o meu."
  description: "Nasci em uma favela de uma pequena cidade brasileira, sem um caminho óbvio para a tecnologia. O que eu tinha era curiosidade, professores que perceberam isso e a convicção de que aprender poderia mudar o rumo da minha vida."
  navigation_label: "Navegação pelos capítulos da jornada"
  timeline_label: "Linha do tempo pessoal e profissional"
  image_alt: "Uma estrada sinuosa nas montanhas ao amanhecer, atravessando a neblina em direção ao horizonte."
  image_legend: "UMA ESTRADA · SEM ATALHOS"
  established: "MOVIDO PELA CURIOSIDADE"
  chapter_label: "CAP."
  problem_label: "O DESAFIO:"
  learned_label: "O QUE APRENDI"
  mindset_label: "MENTALIDADE FORMADA"
  technology_label: "TECNOLOGIAS"
  transition: "O capítulo seguinte exigiu um sistema mais amplo."
  work_link: "VER O TRABALHO"
  close:
    eyebrow: "O PRÓXIMO CAPÍTULO"
    title: "A tecnologia continua mudando."
    emphasis: "O que ela tornou possível mudou tudo."
    description: "Comecei esta jornada acreditando que a tecnologia poderia transformar minha vida. E transformou. O menino de uma favela em uma cidade pequena se tornou um engenheiro cujo trabalho atravessou fronteiras. Viajei pelo Brasil e pelo mundo, construí meu lar e minha família, tornei-me pai de uma criança incrível e conquistei a possibilidade de apoiar meus pais e as pessoas que amo. Essas conquistas não estão separadas da minha trajetória profissional. Elas são a razão pela qual ela importa."
  chapters:
    - period: "ANOS 1990-INÍCIO DOS 2000"
      nav_year: "1990"
      eyebrow: "ACESSO · CURIOSIDADE · AUTONOMIA"
      title: "O primeiro sistema que precisei construir foi o meu próprio futuro."
      role: "ESTUDANTE / PROFESSOR / TECNÓLOGO AUTODIDATA"
      problem: "O acesso à tecnologia era escasso, e não havia um caminho pronto esperando por mim."
      story:
        - "Meus professores perceberam minha dedicação e me ajudaram a entrar em programas públicos de informática. Uma oportunidade levou a outra, até eu me ver aprendendo BASIC e QBasic sem ainda perceber que havia começado a programar."
        - "Meu primeiro computador fora de uma instituição foi um XT antigo que meu tio trouxe para casa. Joguei Carmen Sandiego, claro, mas também quis entender o que acontecia antes do jogo aparecer: como a máquina iniciava, de onde vinham seus limites e o que fazia o sistema funcionar."
        - "Mais tarde, cursei Processamento de Dados, aprendi Clipper e comecei a criar um sistema para o centro comunitário do meu bairro. Desmontei e remontei meu primeiro computador, instalei Linux, recompilei o kernel para fazer um soft modem funcionar e construí uma rede doméstica. Antes de ser pago para trabalhar com tecnologia, eu já estava aprendendo, construindo, resolvendo problemas e ensinando."
      learned: "Não é preciso ter condições perfeitas para começar. É preciso curiosidade, persistência e coragem para ir além do que já se sabe."
      mindset: "Meu ponto de partida não determina até onde posso chegar."
      tech: ["BASIC", "QBasic", "Clipper", "Linux", "Hardware", "Redes"]
      tags: "backend,infrastructure"
    - period: "INÍCIO DA CARREIRA"
      nav_year: "INÍCIO"
      eyebrow: "INFRAESTRUTURA · OPERAÇÕES · PRIMEIRA OPORTUNIDADE"
      title: "Conquistei a oportunidade antes de estar pronto para ela."
      role: "INFRAESTRUTURA E SUPORTE TÉCNICO · CONSOFT"
      problem: "Minha primeira vaga em tecnologia exigia redes Windows e Windows NT. Eu não conhecia nenhum dos dois."
      story:
        - "Convenci um amigo a levar o computador até minha casa, peguei um switch emprestado com outro e montei uma rede Windows para experimentar antes da entrevista. Consegui a vaga. Então passei meu primeiro dia montando um ambiente Windows NT e aprendendo sozinho como realizar o trabalho."
        - "O suporte à infraestrutura da Secretaria da Fazenda de São Paulo me deu uma visão que muitos desenvolvedores só encontram mais tarde. Trabalhei com redes, roteamento, DNS, servidores web e de e-mail, bancos de dados, sistemas operacionais e produção. Também criei uma ferramenta em PHP e MySQL para acompanhar processos. A infraestrutura me deu a base. O software mostrou quanto mais eu poderia criar sobre ela."
      learned: "Aplicações não existem isoladamente. Atrás de cada linha de código há um sistema operacional, uma rede, um banco de dados, uma fronteira de segurança e alguém dependendo de tudo isso."
      mindset: "Entender o sistema inteiro, principalmente as partes que outros ignoram."
      tech: ["TCP/IP", "DNS", "Linux", "Windows Server", "Active Directory", "Solaris", "PHP", "MySQL"]
      tags: "infrastructure,backend"
    - period: "2008-2016"
      nav_year: "2008"
      eyebrow: "DESENVOLVIMENTO · ESCALA · LIDERANÇA"
      title: "Entrei como desenvolvedor. Cresci até assumir o todo."
      role: "DESENVOLVEDOR PHP → DESENVOLVEDOR .NET → DESENVOLVEDOR LÍDER · LEVEL UP GAMES"
      problem: "Uma das maiores publicadoras de jogos online do Brasil precisava atender jogadores, pagamentos, suporte, comércio eletrônico e grandes downloads sob demanda intensa."
      story:
        - "Minha experiência em infraestrutura mudou a forma como eu abordava software. Quando os servidores sofriam com o tráfego, eu acompanhava o problema pela rede, servidor web, cache, banco de dados e implantação. Comecei orientando um desenvolvedor júnior, migrei para o time .NET mais próximo do núcleo do negócio e depois liderei uma equipe de seis pessoas."
        - "Pouco depois de chegar, identifiquei vulnerabilidades e propus correções. Eu estava tecnicamente certo, mas ainda não sabia transformar conhecimento em ação organizacional. Quando a empresa sofreu um ataque, participei da resposta ao incidente. Descobrir um risco é apenas o começo. Um líder precisa comunicá-lo de uma forma que torne a ação possível."
      learned: "Liderança em engenharia é ajudar as pessoas a entender o problema, tomar decisões melhores e avançar juntas quando há muito em jogo."
      mindset: "Assumir o resultado, não apenas a implementação."
      tech: ["PHP", ".NET", "C#", "AngularJS", "Yii", "Apache", "Nginx", "Varnish", "Jenkins"]
      tags: "fullstack,backend,leadership,quality"
    - period: "2016-2019"
      nav_year: "2016"
      eyebrow: "ENTREGA GLOBAL · DEVOPS · ARQUITETURA"
      title: "Meu trabalho atravessou fronteiras antes de mim."
      role: "DESENVOLVEDOR FRONTEND / ENGENHEIRO DEVOPS / ARQUITETO DE SOFTWARE · CROSSOVER"
      problem: "Equipes globais precisavam modernizar sistemas corporativos longevos sem interromper as pessoas que já dependiam deles."
      story:
        - "A Crossover foi minha primeira experiência trabalhando para uma empresa dos Estados Unidos. Atuei em frontend, DevOps, infraestrutura em nuvem e arquitetura, aprofundando minha experiência com Docker, Azure, AWS, CI/CD e modernização corporativa."
        - "A função mudou minha forma de pensar sobre arquitetura. Uma boa ideia não bastava. Eu precisava tornar o raciocínio visível, testar hipóteses, construir provas de conceito e oferecer evidências para equipes distribuídas avançarem."
      learned: "Arquitetura não é autoridade. É transformar ambiguidade em decisões que uma equipe consegue entender, testar e executar."
      mindset: "Tornar a direção clara o bastante para que outros construam sobre ela."
      tech: ["AngularJS", "Docker", "CI/CD", "Azure", "AWS", "SQL Server", "IBM Watson"]
      tags: "frontend,backend,fullstack,leadership,quality"
    - period: "2019-2023"
      nav_year: "2019"
      eyebrow: "MODERNIZAÇÃO DE PLATAFORMA · ACESSIBILIDADE"
      title: "Aprendi a modernizar sem perder o que já funcionava."
      role: "DESENVOLVEDOR FULL-STACK SÊNIOR / ENGENHEIRO DE SOFTWARE SÊNIOR · CEROS"
      problem: "Uma plataforma criativa madura precisava evoluir em APIs, frontend, acessibilidade, testes, infraestrutura e práticas de engenharia."
      story:
        - "Na Ceros, modernização não foi uma única migração. Projetei APIs, ajudei a migrar o frontend de Backbone para React, corrigi problemas de acessibilidade, fortalecei testes automatizados e melhorei os sistemas de infraestrutura e entrega ao redor do produto."
        - "O trabalho exigiu mais que substituir tecnologia antiga. Cada decisão arquitetural afetava clientes, equipes de produto e os engenheiros que manteriam a plataforma depois de nós."
      learned: "A melhor modernização respeita o valor que já existe no produto enquanto remove as limitações que o impedem de avançar."
      mindset: "Deixar a plataforma mais capaz do que quando a encontrei."
      tech: ["React", "TypeScript", "NestJS", "Docker", "Jenkins", "Terraform", "Cloudflare", "Testes E2E"]
      tags: "frontend,backend,fullstack,accessibility,leadership,quality"
    - period: "2023-2026"
      nav_year: "2023"
      eyebrow: "DO ZERO AO PRODUTO · RESPONSABILIDADE · IA"
      title: "A especificação muitas vezes era uma ideia e uma conversa."
      role: "DESENVOLVEDOR FULL-STACK SÊNIOR / ENGENHEIRO DE IA · PRODUTOS EM ESTÁGIO INICIAL"
      problem: "Empresas em estágio inicial precisavam transformar ideias incertas em produtos que pessoas pudessem usar e o negócio operar."
      story:
        - "Por quase três anos, ajudei pequenas empresas a levar ideias do papel ao MVP e do MVP à produção. Raramente havia uma equipe grande ou especificação perfeita, então transitei entre produto, interface, APIs, dados, nuvem, entrega e mentoria."
        - "Foi também quando a IA se tornou central no meu trabalho, como capacidade do produto e parceira de engenharia. Aprendi que conectar uma aplicação a um modelo é a parte fácil. O produto real está ao redor dele: contexto, validação, estado, transferência humana, segurança, recuperação, custo e confiança."
      learned: "Engenharia em estágio inicial é transformar incerteza em algo útil, testável e real."
      mindset: "Não esperar pela certeza. Construir o sistema que a produz."
      tech: ["TypeScript", "React", "Node.js", "GraphQL", "AWS", "ECS", "CDK", "RAG", "Fluxos com LLM"]
      tags: "ai,frontend,backend,fullstack,leadership,quality"
    - period: "2026-HOJE"
      nav_year: "2026"
      eyebrow: "ENTREGA NATIVA EM IA · JULGAMENTO DE ENGENHARIA"
      title: "O desenvolvimento de software mudou. Eu mudei com ele."
      role: "ENGENHEIRO DE SOFTWARE SÊNIOR / ENGENHEIRO DE IA · G2i"
      problem: "Projetos acelerados exigiam funcionalidades completas em bases desconhecidas, mudanças frequentes de contexto e um ritmo de entrega inflexível."
      story:
        - "Na G2i, agentes de IA passaram a integrar meu fluxo completo de engenharia. Eu os direciono em frentes full-stack, oferecendo contexto, arquitetura, restrições e critérios de aceitação para produzir resultados úteis."
        - "Os agentes oferecem alavancagem, não responsabilidade. Continuo responsável por revisar o trabalho, questionar hipóteses, testar o comportamento, verificar segurança e desempenho e decidir se está pronto para entrega. Eu não estava assistindo à chegada da próxima era do software. Já estava trabalhando dentro dela."
      learned: "A IA pode multiplicar a capacidade de implementação. Ela não substitui contexto, critério, responsabilidade ou julgamento de engenharia."
      mindset: "Usar IA como alavanca. Manter humana a responsabilidade."
      tech: ["Agentes de IA", "TypeScript", "APIs", "Bancos de dados", "Playwright", "Vitest", "CI/CD", "Engenharia de desempenho"]
      tags: "ai,frontend,backend,fullstack,quality"

