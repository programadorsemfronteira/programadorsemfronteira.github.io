  work: { kicker: "TRABALHOS SELECIONADOS", chapter: "CAPÍTULO", title: "Problemas assumidos de ponta a ponta,", title_lines: ["Problemas assumidos", "de ponta a ponta,"], emphasis: "com evidências.", description: "Uma seleção de sistemas, modernizações e produtos, da arquitetura à entrega.", filter_title: "Explore por tecnologia", filter_help: "Selecione múltiplas tags. Os resultados usam filtro OU e a URL pode ser compartilhada.", screenshot: "VER SISTEMA", internal_carousel: "Capturas estáticas de sistema interno", hero_alt: "Uma bancada de engenharia com diagramas de arquitetura, notebook, servidor e instrumentos de medição.", hero_legend: "ENGENHARIA · SISTEMAS · ENTREGA", established: "DESDE 2008", previous_image: "Imagem anterior", next_image: "Próxima imagem", internal_screenshot: "CAPTURA DE TELA INTERNA", stack: "TECNOLOGIAS" }
  projects: [{type: "ENGENHARIA DE IA", title: "G2i", description: "Entrega full-stack para ambientes de treinamento de IA, delegando a criação de código a agentes de IA e garantindo pessoalmente segurança, precisão e qualidade da entrega final.", tags: [ai,typescript,fullstack,frontend,backend,performance,"fast-paced delivery",quality], outcome: "Entrega nativa em IA com responsabilidade", link: "#contact", link_label: "VER EXPERIÊNCIA"}, {type: "ATENDIMENTO COM IA", title: "Aiah", description: "Atendimento com IA resiliente pela API do WhatsApp da Meta, com respostas protegidas, transferência humana e recuperação após falhas.", tags: [typescript,nodejs,tailwind,aws,ai,whatsapp-api,frontend,backend,fullstack,leadership,quality], outcome: "Produto de IA de ponta a ponta", link: "#contact", link_label: "VER ESTUDO"}, {type: "PLATAFORMA INTERNA", title: "Wolf Pro Link", description: "A Wolf Pro Link conecta atletas a profissionais e gestores do esporte. Preparei a aplicação para computação em nuvem, construí o ambiente AWS e automatizei a entrega com infraestrutura como código e CI/CD.", tags: [typescript,react,nodejs,aws,frontend,backend,fullstack,leadership,quality], outcome: "60% menos erros · 3× mais usuários", link: "#contact", link_label: "VER ESTUDO", internal: true}, {type: "PLATAFORMA LOGÍSTICA", title: "Redestina", description: "A Redestina coordena transferências de contêineres entre terminais portuários. Trabalhei no monitoramento de chegadas, nas etapas ordenadas e na recuperação de falhas, enquanto orientava desenvolvedores juniores na implementação e revisão.", tags: [aws,dynamodb,sqs,tailwind,frontend,backend,fullstack,quality], outcome: "Fluxos seguros e recuperáveis", link: "#contact", link_label: "VER EXPERIÊNCIA"}, {type: "CÓDIGO ABERTO", title: "Rocketicons", description: "Um kit de código aberto que criei e mantenho com um amigo, dividindo as responsabilidades. Juntos, criamos uma CLI que adiciona apenas os componentes escolhidos ao código de projetos React ou React Native, com estilos compatíveis com Tailwind e catálogo estático.", tags: [typescript,react,react-native,nodejs,tailwind,frontend,fullstack,quality], outcome: "Ícones escolhidos, código local", link: "https://github.com/rocketclimb/rocketicons", link_label: "VER REPOSITÓRIO"}, {type: "NEGOCIAÇÃO SIMULADA", title: "Freedom", description: "Freedom é um sistema de pesquisa e negociação simulada para a B3 que construí sobre evidências reproduzíveis. A estratégia ativa de tendência usa dados diários fechados, controles de risco e uma corretora simulada persistente; o ML experimental não decide operações.", tags: [python,fastapi,postgresql,redis,backend,quality], outcome: "Negociação simulada auditável", link: "#contact", link_label: "VER EXPERIÊNCIA"}, {type: "PLATAFORMA MUSICAL", title: "Apolo Live", description: "Construí uma plataforma para músicos encontrarem apresentações, criarem conexões e mostrarem seu trabalho, adaptando a experiência web a conexões lentas e iniciando uma evolução para web e dispositivos móveis.", tags: [react-native,flutter,ssr,gcp,performance,frontend,backend,fullstack,quality], outcome: "Plataforma guiada pelo público", link: "#contact", link_label: "VER EXPERIÊNCIA"}, {type: "PLATAFORMA CORPORATIVA", title: "Ceros", description: "Modernizei a plataforma SaaS criativa da Ceros em arquitetura de APIs, interfaces React, acessibilidade, testes e ferramentas de entrega.", tags: [typescript,react,nestjs,nodejs,docker,terraform,cloudflare,frontend,backend,fullstack,leadership,quality,accessibility], outcome: "Plataforma mais acessível e sustentável", link: "#contact", link_label: "VER ESTUDO"}, {type: "MODERNIZAÇÃO DE PLATAFORMA", title: "Crossover", description: "Modernizei uma plataforma legada de RH, integrei IBM Watson à educação e tornei as entregas mais reproduzíveis com CI/CD, contêineres e pesquisa de infraestrutura Azure.", tags: [angularjs,docker,azure,sql-server,ibm-watson,frontend,backend,fullstack,leadership,quality], outcome: "Sistemas e entregas modernizados", link: "#contact", link_label: "VER EXPERIÊNCIA"}, {type: "PLATAFORMA DE JOGOS", title: "Level Up Games", description: "Na então maior publicadora de jogos online do Brasil, liderei uma equipe de seis pessoas e tornei servidores dedicados mais eficientes sob milhares de requisições simultâneas.", tags: [php,dotnet,angularjs,yii,tux,apache,varnish,nginx,jenkins,frontend,backend,fullstack,leadership,quality], outcome: "Plataforma de alto tráfego e crescimento da equipe", link: "#contact", link_label: "VER EXPERIÊNCIA"}, {type: "INFRAESTRUTURA PÚBLICA", title: "Consoft", description: "Na Consoft, apoiei a infraestrutura da Secretaria da Fazenda de São Paulo e criei uma ferramenta de acompanhamento de processos em PHP/MySQL em um ambiente misto de servidores e redes.", tags: [php,mysql,windows-server,active-directory,linux,dns,solaris,tcp-ip,infrastructure,backend], outcome: "Base em infraestrutura e software", link: "#contact", link_label: "VER EXPERIÊNCIA"}]
