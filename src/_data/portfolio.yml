  capabilities: { eyebrow: "WHAT I CARRY INTO THE ROOM", title: "Breadth,", emphasis: "with depth.", description: "A senior engineer's job is holding the whole product in mind, from users to infrastructure, from code to operations, and knowing which lever to pull first. These disciplines compound.", link: "HOW I THINK", items: [{title: "Full-Stack Engineering", tag: fullstack, description: "Modern web applications with React, TypeScript, Node.js and pragmatic architecture."}, {title: "Cloud Architecture", tag: aws, description: "Scalable, secure, and cost-aware systems on AWS."}, {title: "System Design", tag: backend, description: "From first principles to production-ready architectures."}, {title: "AI-Native Engineering", tag: ai, description: "Integrating LLMs and agentic workflows into real products."}, {title: "Technical Leadership", tag: leadership, description: "Aligning teams, trade-offs, and technical direction."}, {title: "Production Quality", tag: quality, description: "Testing, observability, incident response, and continuous improvement."}, {title: "Accessibility", tag: accessibility, description: "Inclusive products that work for more people."}, {title: "AI as Leverage", tag: ai, description: "Tools that multiply the impact of good engineering."}] }
