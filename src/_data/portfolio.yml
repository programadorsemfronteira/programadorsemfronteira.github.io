  projects: [{type: "AI ENGINEERING", title: "G2i", description: "Full-stack delivery for AI training environments, delegating code creation to AI agents while personally ensuring security, accuracy, and final delivery quality.", tags: [ai,typescript,fullstack,frontend,backend,performance,"fast-paced delivery",quality], outcome: "Accountable AI-native delivery", link: "#contact", link_label: "VIEW EXPERIENCE"}, {type: "AI CUSTOMER SERVICE", title: "Aiah", description: "Resilient AI customer service on the Meta WhatsApp API, with guarded LLM replies, human handoff, and outage recovery.", tags: [typescript,nodejs,tailwind,aws,ai,whatsapp-api,frontend,backend,fullstack,leadership,quality], outcome: "End-to-end AI product", link: "#contact", link_label: "VIEW CASE STUDY"}, {type: "INTERNAL PLATFORM", title: "Wolf Pro Link", description: "Wolf Pro Link connects athletes with sports professionals and managers. I prepared its application for cloud compute, built the AWS environment, and automated delivery with infrastructure as code and CI/CD.", tags: [typescript,react,nodejs,aws,frontend,backend,fullstack,leadership,quality], outcome: "60% fewer runtime errors · 3× concurrent users", link: "#contact", link_label: "VIEW CASE STUDY", internal: true}, {type: "LOGISTICS PLATFORM", title: "Redestina", description: "Redestina coordinates container transfers between port terminals. I worked on arrival monitoring, ordered handoffs, and failure recovery while mentoring junior developers through implementation and review.", tags: [aws,dynamodb,sqs,tailwind,frontend,backend,fullstack,quality], outcome: "Secure, recoverable workflows", link: "#contact", link_label: "VIEW EXPERIENCE"}, {type: "OPEN SOURCE", title: "Rocketicons", description: "An open-source icon toolkit I co-created and co-maintain with a friend. Together, we built a CLI that adds selected React or React Native components as local source, with Tailwind-compatible styling and a static catalog.", tags: [typescript,react,react-native,nodejs,tailwind,frontend,fullstack,quality], outcome: "Selected icons, local source", link: "https://github.com/rocketclimb/rocketicons", link_label: "VIEW REPOSITORY"}, {type: "PAPER TRADING", title: "Freedom", description: "Freedom is a B3 research and paper-trading system I built around reproducible evidence. Its active momentum strategy uses completed daily data, risk controls, and a persistent simulated broker; experimental ML has no trade authority.", tags: [python,fastapi,postgresql,redis,backend,quality], outcome: "Auditable paper trading", link: "#contact", link_label: "VIEW EXPERIENCE"}, {type: "MUSIC PLATFORM", title: "Apolo Live", description: "Built a platform where musicians could find gigs, connect, and showcase their work, shaping the web experience for slower connections and starting a shared web/mobile direction.", tags: [react-native,flutter,ssr,gcp,performance,frontend,backend,fullstack,quality], outcome: "Audience-led, search-visible platform", link: "#contact", link_label: "VIEW EXPERIENCE"}, {type: "ENTERPRISE PLATFORM", title: "Ceros", description: "Modernized Ceros’s creative SaaS platform across API architecture, React interfaces, accessibility, testing, and delivery tooling.", tags: [typescript,react,nestjs,nodejs,docker,terraform,cloudflare,frontend,backend,fullstack,leadership,quality,accessibility], outcome: "More accessible, maintainable platform", link: "#contact", link_label: "VIEW CASE STUDY"}, {type: "PLATFORM MODERNIZATION", title: "Crossover", description: "Modernized a legacy HR platform, integrated IBM Watson into education, and made delivery more repeatable through CI/CD, containers, and Azure infrastructure research.", tags: [angularjs,docker,azure,sql-server,ibm-watson,frontend,backend,fullstack,leadership,quality], outcome: "Modernized systems and delivery", link: "#contact", link_label: "VIEW EXPERIENCE"}, {type: "GAMES PLATFORM", title: "Level Up Games", description: "At Brazil’s then-largest online-game publisher, I led a six-person team and made dedicated servers more efficient under thousands of simultaneous requests.", tags: [php,dotnet,angularjs,yii,tux,apache,varnish,nginx,jenkins,frontend,backend,fullstack,leadership,quality], outcome: "High-traffic platform and team growth", link: "#contact", link_label: "VIEW EXPERIENCE"}, {type: "PUBLIC-SECTOR INFRASTRUCTURE", title: "Consoft", description: "At Consoft, supported São Paulo State Department of Finance infrastructure and built a PHP/MySQL process-status tool across a mixed server and network environment.", tags: [php,mysql,windows-server,active-directory,linux,dns,solaris,tcp-ip,infrastructure,backend], outcome: "Infrastructure-to-software foundation", link: "#contact", link_label: "VIEW EXPERIENCE"}]
